<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TallyEssential Level 1 Certification Exam</title>
<style>
:root{--bg:#e9e2cf;--card:#fbf8ef;--ink:#2a2620;--soft:#6b6455;--line:#b9ac86;--moss:#4f7a5f;--seal:#a3392a;--dim:#ddd4bb;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2620;--card:#232f27;--ink:#eee7d4;--soft:#9aa79c;--line:#4a5a4f;--moss:#6ea67f;--seal:#e07a68;--dim:#2c3a31;--on:#10170f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c2620;--card:#232f27;--ink:#eee7d4;--soft:#9aa79c;--line:#4a5a4f;--moss:#6ea67f;--seal:#e07a68;--dim:#2c3a31;--on:#10170f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px 14px 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:780px;margin:auto}
.mast{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
.mast h1{font:500 25px Georgia,"Palatino Linotype",serif;margin:0}
.logo{width:64px;height:64px;border-radius:8px;background:#fff;flex:none}
.mast p{margin:4px 0 0;color:var(--soft);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--moss);padding:24px;border-radius:3px}
.card h2{font:500 21px Georgia,serif;margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.stub{border:1px dashed var(--line);background:var(--dim);color:var(--ink);padding:20px;text-align:left;font:inherit;cursor:pointer;border-radius:3px}
.stub b{display:block;font:500 19px Georgia,serif;margin-bottom:4px}
label{display:block;font-size:13px;color:var(--soft);margin:14px 0 5px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;font:13px ui-monospace,Consolas,monospace}
.btn{background:var(--moss);color:var(--on);border:0;padding:11px 20px;font:inherit;font-weight:600;border-radius:3px;cursor:pointer;margin:14px 8px 0 0}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.err{color:var(--seal);font-size:14px;margin-top:8px;min-height:20px}
ul.ins{padding-left:20px;color:var(--soft);font-size:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-bottom:10px;border-bottom:1px solid var(--line);font-size:14px;gap:10px;flex-wrap:wrap}
.timer{font:600 20px ui-monospace,Consolas,monospace}.timer.low{color:var(--seal)}
.qn{font-size:13px;color:var(--soft);margin-bottom:6px}.q{font-size:18px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--moss);background:var(--dim);outline:2px solid var(--moss)}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:18px}
.pal button{padding:7px 0;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;font:inherit;font-size:13px;cursor:pointer}
.pal .ans{background:var(--moss);color:var(--on);border-color:var(--moss)}.pal .flag{border:2px solid var(--seal)}.pal .cur{outline:2px solid var(--ink)}
.big{font:500 52px Georgia,serif;color:var(--moss);margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.scroll{overflow-x:auto}tr.r{cursor:pointer}tr.r:hover{background:var(--dim)}
.pass{color:var(--moss);font-weight:600}.fail{color:var(--seal);font-weight:600}
.small{font-size:13px;color:var(--soft)}

<script>
const D=[{"m":1,"d":"e","q":"Accounting is the process of:","o":["Identifying, recording, summarising, analysing and interpreting financial information","Only calculating cash","Only preparing invoices","Only paying expenses"],"a":0},{"m":1,"d":"e","q":"Which of the following is the first phase in the accounting cycle shown in the module?","o":["Trial Balance","Understanding the transaction","Balance Sheet","Profit and Loss Account"],"a":1},{"m":1,"d":"e","q":"A journal is commonly known as the:","o":["Book of final accounts","Book of original entry","Stock register","Bank statement"],"a":1},{"m":1,"d":"e","q":"Which account records transactions relating to individuals, firms and institutions?","o":["Real Account","Nominal Account","Personal Account","Trading Account"],"a":2},{"m":1,"d":"e","q":"The golden rule for a Personal Account is:","o":["Debit what comes in","Credit what goes out","Debit the receiver and credit the giver","Debit all incomes"],"a":2},{"m":1,"d":"e","q":"Which is an example of a Real Account?","o":["Rent Account","Furniture Account","Salary Account","Commission Received Account"],"a":1},{"m":1,"d":"e","q":"The golden rule for a Real Account is:","o":["Debit the receiver","Debit what comes in and credit what goes out","Debit all expenses","Credit the receiver"],"a":1},{"m":1,"d":"e","q":"Which of these is a Nominal Account?","o":["Cash","Building","Salary","Debtor"],"a":2},{"m":1,"d":"e","q":"The golden rule for Nominal Accounts is:","o":["Debit all expenses and losses; credit all incomes and gains","Debit the giver; credit the receiver","Debit what goes out; credit what comes in","Debit capital; credit assets"],"a":0},{"m":1,"d":"e","q":"Under the double-entry system, every transaction affects:","o":["Only one account","At least two accounts","Only cash account","Only capital account"],"a":1},{"m":1,"d":"e","q":"In a journal, the L.F. column stands for:","o":["Ledger Format","Ledger Folio","List of Funds","Ledger Figure"],"a":1},{"m":1,"d":"e","q":"The Trial Balance contains:","o":["Only assets","Only expenses","Ledger balances in debit and credit columns","Only cash transactions"],"a":2},{"m":1,"d":"e","q":"The Trading Account is prepared to find:","o":["Net profit only","Gross profit or gross loss","Cash balance","Total liabilities"],"a":1},{"m":1,"d":"e","q":"The Profit and Loss Account helps determine:","o":["Gross purchases","Net profit or net loss","Closing cash only","Total debtors"],"a":1},{"m":1,"d":"e","q":"A Balance Sheet summarises the:","o":["Daily cash receipts","Assets and liabilities of a business","Only sales","Only expenses"],"a":1},{"m":1,"d":"e","q":"Goods returned to a supplier are recorded in the:","o":["Sales Book","Purchase Return Book","Petty Cash Book","Sales Return Book"],"a":1},{"m":1,"d":"e","q":"The book used to record credit sales of merchandise is the:","o":["Purchase Book","Sales Book","Cash Book","Journal Proper"],"a":1},{"m":1,"d":"e","q":"A Petty Cash Book is mainly used for:","o":["Large machinery purchases","Frequent small expenses","Credit sales","Owner's capital"],"a":1},{"m":1,"d":"e","q":"Depreciation refers to:","o":["Increase in cash","Loss in value of a depreciable asset over time/use","Increase in capital","Goods returned by customers"],"a":1},{"m":1,"d":"e","q":"Which is an advantage of computerised accounting mentioned in the module?","o":["More manual calculations","Arithmetical accuracy","Slower reporting","No financial reports"],"a":1},{"m":1,"d":"m","q":"The correct sequence of the accounting cycle presented in the module is:","o":["Journal → Understanding → Trial Balance → Ledger → Balance Sheet → P&L","Understanding → Journal → Ledger Posting → Trial Balance → P&L → Balance Sheet","Ledger → Journal → Balance Sheet → Trial Balance → P&L","Understanding → Trial Balance → Journal → Ledger → Balance Sheet"],"a":1},{"m":1,"d":"m","q":"The owner introduces ₹2,00,000 into the business through bank. Which entry is correct?","o":["Capital A/c Dr. To Bank A/c","Bank A/c Dr. To Capital A/c","Cash A/c Dr. To Sales A/c","Purchases A/c Dr. To Bank A/c"],"a":1},{"m":1,"d":"m","q":"Furniture costing ₹12,000 is purchased for cash. Which accounts are affected?","o":["Furniture and Cash","Purchases and Creditors","Capital and Furniture","Salary and Cash"],"a":0},{"m":1,"d":"m","q":"Goods worth ₹25,000 are purchased on credit from Meena Traders. The correct entry is:","o":["Meena Traders Dr. To Purchases","Purchases Dr. To Meena Traders","Cash Dr. To Purchases","Purchases Dr. To Cash"],"a":1},{"m":1,"d":"m","q":"A business pays rent of ₹8,000 by bank. Which account is debited?","o":["Bank A/c","Capital A/c","Rent A/c","Landlord A/c"],"a":2},{"m":1,"d":"m","q":"A journal entry involving more than one debit or more than one credit is called a:","o":["Simple entry","Compound entry","Opening entry","Closing balance"],"a":1},{"m":1,"d":"m","q":"Which statement about a Trial Balance is correct?","o":["It lists only nominal accounts","It checks the arithmetical agreement of ledger debit and credit balances","It is the same as a Balance Sheet","It records transactions chronologically"],"a":1},{"m":1,"d":"m","q":"Which item is normally shown on the debit side of the Trading Account?","o":["Net sales","Closing stock","Opening stock","Gross loss"],"a":2},{"m":1,"d":"m","q":"Net sales are calculated as:","o":["Sales + Sales Returns","Sales − Sales Returns","Sales − Purchases","Purchases − Purchase Returns"],"a":1},{"m":1,"d":"m","q":"Net purchases are calculated as:","o":["Purchases + Purchase Returns","Purchases − Purchase Returns","Sales − Sales Returns","Opening Stock + Closing Stock"],"a":1},{"m":1,"d":"m","q":"Gross profit is transferred from the Trading Account to the:","o":["Debit side of Balance Sheet","Credit side of Profit and Loss Account","Creditors Account","Cash Book"],"a":1},{"m":1,"d":"m","q":"Which item is normally treated as an indirect expense in the Profit and Loss Account?","o":["Carriage inward","Factory wages","Office salaries","Freight inward"],"a":2},{"m":1,"d":"m","q":"Which of the following is a current asset?","o":["Long-term loan payable","Cash at bank","Sundry creditors","Bills payable"],"a":1},{"m":1,"d":"m","q":"A transaction involving a bank institution is classified as a Personal Account in the traditional classification because a bank is:","o":["A natural person","An artificial person/institution","A nominal account","A real asset"],"a":1},{"m":1,"d":"m","q":"The Evidence Concept of accounting emphasises:","o":["Recording without documents","Supporting transactions with evidence/documents","Ignoring monetary values","Closing accounts daily"],"a":1},{"m":1,"d":"m","q":"The Going Concern Concept assumes that:","o":["The business will close immediately","The business will continue operating for the foreseeable future","All assets must be sold today","Only cash transactions are recorded"],"a":1},{"m":1,"d":"m","q":"The Matching Concept requires that:","o":["Expenses be matched with the revenue they help generate for an accounting period","All expenses be recorded as assets","Only cash expenses be recorded","Capital be matched with drawings"],"a":0},{"m":1,"d":"m","q":"Which subsidiary book records small repetitive payments such as postage and conveyance?","o":["Sales Book","Petty Cash Book","Purchase Return Book","Journal Proper"],"a":1},{"m":1,"d":"m","q":"The Journal Proper is used for:","o":["All cash receipts","Transactions not recorded in special journals","Only credit sales","Only credit purchases"],"a":1},{"m":1,"d":"m","q":"A three-column cash book contains columns for:","o":["Cash, bank and discount","Cash, stock and purchases","Sales, purchases and returns","Debit, credit and narration"],"a":0},{"m":1,"d":"h","q":"A business purchased machinery for ₹1,00,000 by cheque. Which journal entry follows the rules in the module?","o":["Machinery Dr. ₹1,00,000; To Bank ₹1,00,000","Bank Dr. ₹1,00,000; To Machinery ₹1,00,000","Purchases Dr. ₹1,00,000; To Capital ₹1,00,000","M
